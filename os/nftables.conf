#!/usr/sbin/nft -f
# os/nftables.conf
# PLACEHOLDERS -- fill in before deploy, see os/VERIFY.md.
define LAN_SUBNET = 192.0.2.0/24   # CHANGEME: real LAN CIDR
define UI_PORT     = 0             # CHANGEME: ui/'s TCP listen port
define SSH_PORT    = 22

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ip saddr $LAN_SUBNET tcp dport { $SSH_PORT, $UI_PORT } ct state new accept
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
    }
    chain output {
        type filter hook output priority 0; policy drop;
        oif lo accept
        ct state established,related accept
    }
}
